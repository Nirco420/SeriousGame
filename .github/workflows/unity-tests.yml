name: Unity Tests

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  editmode-tests:
    name: EditMode Tests
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Read Unity version
        id: unity
        shell: bash
        run: |
          UNITY_VERSION=$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)
          echo "version=$UNITY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Unity version: $UNITY_VERSION"

      - name: Run Unity EditMode Tests
        id: unity_tests
        continue-on-error: true
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          mkdir -p artifacts

          docker run --rm \
            --shm-size=1g \
            -e UNITY_EMAIL \
            -e UNITY_PASSWORD \
            -e UNITY_SERIAL \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            unityci/editor:ubuntu-${{ steps.unity.outputs.version }}-base-3 \
            bash -lc '
              set -e

              mkdir -p /root/.cache/unity3d
              mkdir -p /root/.local/share/unity3d/Unity
              mkdir -p /github/workspace/artifacts

              echo "Activating Unity license..."

              xvfb-run \
                --auto-servernum \
                --server-args="-screen 0 640x480x24" \
                unity-editor \
                -batchmode \
                -nographics \
                -quit \
                -username "$UNITY_EMAIL" \
                -password "$UNITY_PASSWORD" \
                -serial "$UNITY_SERIAL" \
                -logFile /github/workspace/artifacts/activation.log

              echo "Unity activation finished."
              echo "Starting EditMode tests..."

              xvfb-run \
                --auto-servernum \
                --server-args="-screen 0 640x480x24" \
                unity-editor \
                -batchmode \
                -nographics \
                -projectPath /github/workspace \
                -runTests \
                -testPlatform editmode \
                -testResults /github/workspace/artifacts/editmode-results.xml \
                -logFile /github/workspace/artifacts/editmode.log
            '

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Test-Results
          path: artifacts
          if-no-files-found: warn

      - name: Check Unity test results
        if: always()
        shell: bash
        env:
          UNITY_STEP_OUTCOME: ${{ steps.unity_tests.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          result_file = "artifacts/editmode-results.xml"
          editmode_log = "artifacts/editmode.log"
          activation_log = "artifacts/activation.log"

          if not os.path.exists(result_file):
              print("ERROR: Unity did not create editmode-results.xml.")

              log_to_show = None

              if os.path.exists(editmode_log):
                  log_to_show = editmode_log
              elif os.path.exists(activation_log):
                  log_to_show = activation_log

              if log_to_show:
                  print(f"\nLast lines of {log_to_show}:")
                  with open(log_to_show, "r", errors="replace") as f:
                      lines = f.readlines()
                      print("".join(lines[-120:]))

              sys.exit(1)

          root = ET.parse(result_file).getroot()

          total = int(root.attrib.get("total", 0))
          passed = int(root.attrib.get("passed", 0))
          failed = int(root.attrib.get("failed", 0))
          skipped = int(root.attrib.get("skipped", 0))

          print(f"Total:   {total}")
          print(f"Passed:  {passed}")
          print(f"Failed:  {failed}")
          print(f"Skipped: {skipped}")

          if os.environ.get("UNITY_STEP_OUTCOME") != "success":
              print("ERROR: Unity exited with an error.")
              sys.exit(1)

          if failed > 0:
              print("ERROR: One or more Unity tests failed.")
              sys.exit(1)

          print("Unity EditMode tests passed.")
          PY